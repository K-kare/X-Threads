{% extends 'base.html' %}
{% load static %}
{% block content %}

   <div class="container text-center">
     <div class="row">
       <div class="col-8">
        
        <br>

           <div class="alert alert-dark" role="alert">
        <div class="container">
          <div class="row">
            <div class="col-1">
                {% if meep.user.profile.profile_image %}
                    <img src="{{ meep.user.profile.profile_image.url }}" width=50 height=50 class="rounded-circle" alt="{{ meep.user.username }}">
                {% else %}
                    <img src="{% static 'images/default_profile_pic (1).png' %}" width=50 height=50 class="rounded-circle" alt="{{ meep.user.username }}">	
                {% endif %}
            </div>
            <div class="col-11">
              {{ meep.body }}
              <br>
              <small class="text-muted">
                {{ meep.created_at}} By @{{ meep.user.username}}
                -{{ meep.number_of_likes}}
                {% if user in meep.likes.all %}
                <a href="{% url 'meep_like' meep.id %}">
                  <i class='bx bxs-heart' style="color:red;"></i>
                </a>
                {% else %}
                <a href="{% url 'meep_like' meep.id %}">
                  <i class='bx bx-heart'></i>
                </a>
                {% endif %}
                
               </small>
            <br><br>
           </div>
          </div> 
        </div> 
      </div>  
    </div>

    <div class="col-4">
        <br><br>
    </div>

{% endblock %}
